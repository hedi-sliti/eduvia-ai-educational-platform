<section class="student-page">
  <header class="page-header">
    <p class="eyebrow">Student</p>
    <h1>Quiz Attempt</h1>
    <p>Answer all questions and submit your attempt.</p>
  </header>

  <div *ngIf="isLoading" class="status loading">Loading quiz...</div>
  <div *ngIf="errorMessage" class="status error">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="status success">{{ successMessage }}</div>

  <div *ngIf="!isLoading && quiz" class="quiz-card">
    <h2>{{ quiz.title }}</h2>
    <p>{{ quiz.description || 'No description available.' }}</p>

    <article class="question" *ngFor="let question of quiz.questions; let i = index">
      <h3>Q{{ i + 1 }}. {{ question.prompt }}</h3>
      <label class="option" *ngFor="let option of question.options; let j = index">
        <input
          type="radio"
          [name]="'q-' + i"
          [checked]="selectedAnswers[i] === j"
          (change)="selectAnswer(i, j)"
        />
        <span>{{ option }}</span>
      </label>
    </article>

    <button type="button" (click)="submitAttempt()" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Submitting...' : 'Submit Attempt' }}
    </button>
  </div>
</section>
