<section class="hero-card">
  <div class="hero-copy">
    <p class="eyebrow">AI-powered educational platform</p>
    <h1>{{ title }}</h1>
    <p class="subtitle">{{ subtitle }}</p>

    <div class="cta-row">
      <a routerLink="/chat" class="btn primary">Start Chatting</a>
      <a routerLink="/login" class="btn secondary">Sign In</a>
    </div>
  </div>
</section>

<section class="overview-section">
  <div class="section-heading">
    <p class="eyebrow">What you can do</p>
    <h2>One platform, three roles, a single learning flow.</h2>
  </div>

  <div class="overview-grid">
    <article class="overview-card" *ngFor="let highlight of highlights">
      <h3>{{ highlight.title }}</h3>
      <p>{{ highlight.text }}</p>
    </article>
  </div>

  <div class="flow-panel">
    <div>
      <p class="eyebrow">Quick path</p>
      <h3>Start in three steps</h3>
    </div>

    <ol>
      <li *ngFor="let step of flow">{{ step }}</li>
    </ol>
  </div>
</section>
