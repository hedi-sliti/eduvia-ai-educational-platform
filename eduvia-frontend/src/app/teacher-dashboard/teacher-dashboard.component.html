<div class="dashboard">
  <div class="dashboard-content">
    <section class="dashboard-hero">
      <div>
        <p class="eyebrow">Teacher workspace</p>
        <h1>Welcome, {{ authService.currentUserValue?.name }}</h1>
        <p>
          Present your courses, discuss student progress, and keep the teaching flow organized for the platform workflow.
        </p>
      </div>

      <div class="hero-summary">
        <span>Role</span>
        <strong>{{ authService.currentUserValue?.role }}</strong>
        <small>Presentation-ready</small>
      </div>
    </section>

    <div *ngIf="isLoading" class="status loading">Loading teacher summary...</div>
    <div *ngIf="errorMessage" class="status error">{{ errorMessage }}</div>

    <div class="grid card-grid">
      <button
        type="button"
        class="card"
        *ngFor="let card of cards"
        (click)="openRoute(card.route)"
      >
        <h3>{{ card.title }}</h3>
        <p>{{ card.description }}</p>
        <strong class="card-value">{{ card.value }}</strong>
      </button>
    </div>

  </div>
</div>
