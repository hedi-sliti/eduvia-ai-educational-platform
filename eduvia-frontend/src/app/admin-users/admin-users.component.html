<section class="admin-page">
  <header class="page-header">
    <p class="eyebrow">Admin</p>
    <h1>User Management</h1>
    <p>Manage platform users and update roles from live backend data.</p>
  </header>

  <div *ngIf="isLoading" class="status loading">Loading users...</div>
  <div *ngIf="errorMessage" class="status error">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="status success">{{ successMessage }}</div>

  <section class="card">
    <h2>{{ editingId ? 'Edit User' : 'Add User' }}</h2>
    <input [(ngModel)]="form.email" type="email" placeholder="Email" />
    <input [(ngModel)]="form.name" placeholder="Name" />
    <input [(ngModel)]="form.password" type="password" placeholder="Password (required for add, optional for edit)" />
    <select [(ngModel)]="form.role">
      <option value="ADMIN">ADMIN</option>
      <option value="TEACHER">TEACHER</option>
      <option value="STUDENT">STUDENT</option>
    </select>

    <div class="actions">
      <button type="button" (click)="saveUser()" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : (editingId ? 'Update User' : 'Create User') }}
      </button>
      <button type="button" class="secondary" (click)="resetForm()">Reset</button>
    </div>
  </section>

  <section class="card">
    <h2>Users</h2>
    <div *ngIf="!users.length" class="muted">No users found.</div>

    <article class="item" *ngFor="let user of users">
      <h3>{{ user.name }}</h3>
      <p>{{ user.email }}</p>
      <small>Role: {{ user.role }}</small>
      <div class="actions">
        <button type="button" (click)="editUser(user)">Edit</button>
        <button type="button" class="danger" (click)="deleteUser(user._id)">Delete</button>
      </div>
    </article>
  </section>
</section>
